name: Sync Tech & Data Keynotes Calendar

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch:      # Enable manual run from GitHub UI
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'AI_CONTEXT.md'
      - 'CLAUDE.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "sync-pipeline"
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m unittest discover tests

      - name: Run keynote pipeline
        run: |
          python -m src.main

      - name: Generate dynamic commit message
        id: commit_info
        run: |
          EVENT_COUNT=$(python3 -c "import json; data=json.load(open('public/events.json')); print(len(data))" 2>/dev/null || echo "0")
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "title=chore(calendar): sync keynote events feed (${EVENT_COUNT} active events)" >> "$GITHUB_OUTPUT"
          echo "body=Automated sync on ${TIMESTAMP} across YouTube live feeds, filtered Techmeme, and curated registry. [skip ci]" >> "$GITHUB_OUTPUT"

      - name: Commit updated public assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "No data changes to commit to main branch."
          else
            git commit -m "${{ steps.commit_info.outputs.title }}" -m "${{ steps.commit_info.outputs.body }}"
            git push origin main
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
          commit_message: "${{ steps.commit_info.outputs.title }}\n\n${{ steps.commit_info.outputs.body }}"
