# Curated registry: ONLY officially confirmed keynotes.
#
# Rules (enforced by src/extractors/curated.py):
#   - Every event needs `source_url`: the official page that states its date AND start time.
#     Entries without it are rejected. Never add estimated or "usually in June" dates.
#   - `end_time` is optional. Most organizers don't publish one; when omitted, the calendar
#     entry gets a 60-minute block and the description says the end time is unpublished.
#   - Past events are dropped automatically.
#
# `watchlist` holds conferences whose dates are officially confirmed but whose keynote time
# is not announced yet. They are NOT published. Move one into `events` once the keynote
# time appears on an official page (or let the YouTube extractor pick up the scheduled stream).

